<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">Der Ping und die Antwort</title><desc id="desc">Ein Ping prüft, ob ein Gerät erreichbar ist. Seine Antwort beweist nicht, dass ein Mensch dort ist.</desc><defs><linearGradient id="night" x2="0" y2="1"><stop stop-color="#173c4b"/><stop offset="1" stop-color="#102633"/></linearGradient><linearGradient id="gold"><stop stop-color="#ddb577"/><stop offset="1" stop-color="#b67b42"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#ddb577"/></marker><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter></defs><rect width="1000" height="390" rx="22" fill="url(#night)"/><rect width="1000" height="390" rx="22" fill="url(#grid)"/><g font-family="system-ui,sans-serif"><text x="36" y="36" fill="#a9c8cb" font-size="13" letter-spacing="2">DER PING · GERÄT ODER MENSCH?</text><g transform="translate(150 152) scale(1)"><rect x="-35" y="-62" width="70" height="124" rx="13" fill="#091c29" stroke="#ddb577" stroke-width="3"/><rect x="-26" y="-43" width="52" height="82" rx="5" fill="#245b62"/><path d="M-18-23H18M-18-11H10M-18 1H16" stroke="#fcf3df" stroke-width="3"/><circle cy="50" r="5" fill="#ddb577"/></g><g transform="translate(790 152) scale(1)"><rect x="-39" y="-57" width="78" height="114" rx="9" fill="#173845" stroke="#8ed6c5" stroke-width="3"/><path d="M-30-29H30M-30-5H30M-30 19H30M-30 43H30" stroke="#638e93" stroke-width="2"/><g fill="#ddb577"><circle cx="-22" cy="-42" r="4"/><circle cx="-22" cy="-18" r="4"/><circle cx="-22" cy="6" r="4"/><circle cx="-22" cy="30" r="4"/></g></g><path d="M214 125H708" stroke="#ddb577" stroke-width="4" marker-end="url(#arrow)"/><path d="M708 181H214" stroke="#8ed6c5" stroke-width="4"/><path d="M225 173L214 181 225 189" fill="none" stroke="#8ed6c5" stroke-width="3"/><text x="455" y="111" text-anchor="middle" fill="#fcf3df" font-size="21">Bist du erreichbar?</text><text x="455" y="218" text-anchor="middle" fill="#8ed6c5" font-size="21">Das Gerät antwortet.</text><g transform="translate(44 280)"><rect width="420" height="82" rx="12" fill="#fcf3df"/><path d="M15 0H405" stroke="#ddb577" stroke-width="4"/><text x="18" y="31" fill="#183844" font-size="21" font-weight="700">der Ping</text><text x="18" y="58" fill="#556b70" font-size="15">Eine kurze Frage an ein Gerät.</text><circle cx="403" cy="-8" r="15" fill="#b47b47"/><text x="403" y="-3" text-anchor="middle" fill="white" font-size="13">1</text></g><g transform="translate(536 280)"><rect width="420" height="82" rx="12" fill="#fcf3df"/><path d="M15 0H405" stroke="#ddb577" stroke-width="4"/><text x="18" y="31" fill="#183844" font-size="21" font-weight="700">die Antwort</text><text x="18" y="58" fill="#556b70" font-size="15">Sie beweist noch keinen Menschen.</text><circle cx="403" cy="-8" r="15" fill="#b47b47"/><text x="403" y="-3" text-anchor="middle" fill="white" font-size="13">2</text></g></g></svg>