<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">Vergleichen, sichern, ändern, prüfen</title><desc id="desc">Vier Schritte für sichere Automation. Bei einem Fehler kann Mira zum vorherigen Zustand zurückkehren.</desc><defs><linearGradient id="night" x2="0" y2="1"><stop stop-color="#173c4b"/><stop offset="1" stop-color="#102633"/></linearGradient><linearGradient id="gold"><stop stop-color="#ddb577"/><stop offset="1" stop-color="#b67b42"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#ddb577"/></marker><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter></defs><rect width="1000" height="390" rx="22" fill="url(#night)"/><rect width="1000" height="390" rx="22" fill="url(#grid)"/><g font-family="system-ui,sans-serif"><text x="36" y="36" fill="#a9c8cb" font-size="13" letter-spacing="2">AUTOMATION · EIN PLAN MIT RÜCKWEG</text><g transform="translate(140 154) scale(0.85)"><path d="M-48-25H-9L3-13H48V39H-48Z" fill="#ddb577"/><path d="M-48-13H48L39 39H-57Z" fill="#eacb96"/><path d="M-30 4H27M-30 14H10" stroke="#b47b47" stroke-width="3"/></g><g transform="translate(30 239)"><rect width="225" height="82" rx="12" fill="#fcf3df"/><path d="M15 0H210" stroke="#ddb577" stroke-width="4"/><text x="18" y="31" fill="#183844" font-size="21" font-weight="700">vergleichen</text><text x="18" y="58" fill="#556b70" font-size="15">Was soll sich ändern?</text><circle cx="208" cy="-8" r="15" fill="#b47b47"/><text x="208" y="-3" text-anchor="middle" fill="white" font-size="13">1</text></g><path d="M203 150H265" stroke="#ddb577" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(385 154) scale(0.85)"><rect x="-49" y="-31" width="98" height="62" rx="10" fill="#2e6470" stro